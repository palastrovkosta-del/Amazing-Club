<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doki Doki Gallery</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background: #120c1b;
        display: grid; place-items: center;
        font-family: system-ui, sans-serif;
        color: #cdb8f0;
    }
    .loader {
        text-align: center;
        letter-spacing: .25em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: .8;
    }
</style>
<script>
(function () {
    // Признаки мобильного устройства
    var ua = navigator.userAgent || '';
    var isMobileUA = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile|Windows Phone|BlackBerry/i.test(ua);

    // Узкий экран + тач = тоже мобильный
    var isNarrow = window.innerWidth <= 700;
    var isTouch  = ('ontouchstart' in window) && navigator.maxTouchPoints > 0;

    // Итоговое решение
    var isMobile = isMobileUA || (isNarrow && isTouch);

    // location.replace — чтобы кнопка «назад» не возвращала на редирект
    location.replace(isMobile ? 'mobile.html' : 'pc.html');
})();
</script>
</head>
<body>
    <div class="loader">Загрузка…</div>
</body>
</html>
