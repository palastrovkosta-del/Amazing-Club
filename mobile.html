<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Doki Doki Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Comic Neue', cursive;
    background: #ffffff;
}
body {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
}

/* ==================== ИНТРО ==================== */
.intro-overlay {
    position: fixed; z-index: 9999; inset: 0;
    display: grid; place-items: center; overflow: hidden;
    background: #120c1b; opacity: 1;
    transition: background-color .85s cubic-bezier(.55,0,.25,1), opacity .78s ease;
}
.intro-overlay::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 5%, rgba(0,0,0,.5) 100%);
}
.intro-overlay.turn-white { background-color: #fff; }
.intro-overlay.turn-white::before { opacity: 0; transition: opacity .45s ease; }
.intro-overlay.fade-out { opacity: 0; pointer-events: none; }
.intro-content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; width: 100%; padding: 20px;
    animation: logo-approach 5.15s cubic-bezier(.12,.66,.16,1) both;
}
.intro-logo {
    display: block;
    width: min(40vmin, 340px); height: min(40vmin, 340px);
    object-fit: contain;
    filter: brightness(.22) drop-shadow(0 0 24px rgba(205,170,244,.08));
    transition: filter .8s ease;
}
.turn-white .intro-logo { filter: brightness(1) drop-shadow(0 0 28px rgba(175,145,218,.24)); }
.intro-caption {
    margin: 0; color: rgba(245,236,255,.65);
    font-size: clamp(10px, 1.6vmin, 14px);
    font-style: italic; letter-spacing: .25em; text-transform: uppercase;
    animation: caption-fade 2s ease 1.2s both;
}
.turn-white .intro-caption { color: #7b5e9f; }
@keyframes logo-approach {
    0% { opacity: .25; transform: scale(.19); }
    17% { opacity: .72; }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes caption-fade {
    from { opacity: 0; letter-spacing: .5em; }
    to { opacity: .8; letter-spacing: .25em; }
}

.audio-prompt {
    position: fixed; z-index: 9998; left: 50%; bottom: 5vmin;
    transform: translateX(-50%);
}
.audio-prompt button {
    min-height: 40px; padding: 0 17px;
    border: 1px solid rgba(124, 88, 179, .34);
    border-radius: 999px; color: #fff;
    background: linear-gradient(150deg, #9c7acb, #73519f);
    font-family: 'Comic Neue', cursive;
    font-size: 11px; font-weight: 800;
    cursor: pointer;
}

.music-toggle {
    position: fixed; z-index: 12;
    top: max(10px, calc(env(safe-area-inset-top) + 8px));
    right: max(12px, env(safe-area-inset-right));
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; min-height: 30px; padding: 0 12px;
    border: 1px solid rgba(124, 88, 179, .34);
    border-radius: 999px; color: #6f50a6;
    background: rgba(255,255,255,.85);
    box-shadow: 0 4px 12px rgba(101,73,149,.1);
    font-family: 'Comic Neue', cursive;
    font-size: 9px; font-weight: 900; letter-spacing: .12em;
    cursor: pointer;
}
.music-toggle svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

.main-site {
    width: 100%; height: 100%;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    opacity: 0; transition: opacity 1.5s ease-in;
    background: #ffffff;
    padding: 0 2vmin;
    overflow-y: auto;
    overflow-x: hidden;
}
.main-site.visible { opacity: 1; }

.roof, .floor {
    position: fixed; left: 0; width: 100%; height: 8vmin;
    background: linear-gradient(180deg, #d1c4e9 0%, #b39ddb 100%);
    z-index: 5;
    box-shadow: 0 0.5vmin 2vmin rgba(126, 87, 194, 0.4);
}
.roof  { top: 0;    border-bottom: 0.4vmin solid #9575cd; }
.floor { bottom: 0; border-top: 0.4vmin solid #9575cd; }

.bg-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-layer {
    position: absolute; top: -100%; left: -100%;
    width: 500%; height: 500%;
    display: grid;
    grid-template-columns: repeat(5, 20%);
    grid-template-rows: repeat(5, 20%);
    will-change: transform;
}
.bg-tile { background-position: 0 0; }
.layer-deep { animation: waterfallDeep 30s linear infinite; filter: blur(0.6vmin); }
.layer-deep .bg-tile { background-image: radial-gradient(#e1bee7 30%, transparent 31%); background-size: 28vmin 28vmin; opacity: 0.45; }
.layer-mid { animation: waterfallMid 18s linear infinite; }
.layer-mid .bg-tile { background-image: radial-gradient(#ce93d8 25%, transparent 26%); background-size: 16vmin 16vmin; opacity: 0.5; }
.layer-front { animation: waterfallFront 10s linear infinite; }
.layer-front .bg-tile { background-image: radial-gradient(#ba68c8 20%, transparent 21%); background-size: 9vmin 9vmin; opacity: 0.35; }
@keyframes waterfallDeep { 0% { transform: translate(0, 0); } 100% { transform: translate(28vmin, 28vmin); } }
@keyframes waterfallMid  { 0% { transform: translate(0, 0); } 100% { transform: translate(-16vmin, -16vmin); } }
@keyframes waterfallFront{ 0% { transform: translate(0, 0); } 100% { transform: translate(9vmin, 9vmin); } }

.light-effects { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.light-orb {
    position: absolute; border-radius: 50%;
    filter: blur(8vmin); opacity: 0;
    animation: floatLight linear infinite;
    mix-blend-mode: screen;
}
.light-orb:nth-child(1) { background: #e1bee7; width: 30vmin; height: 30vmin; }
.light-orb:nth-child(2) { background: #ce93d8; width: 22vmin; height: 22vmin; }
.light-orb:nth-child(3) { background: #b39ddb; width: 40vmin; height: 40vmin; }
.light-orb:nth-child(4) { background: #f3e5f5; width: 16vmin; height: 16vmin; }
.light-orb:nth-child(5) { background: #d1c4e9; width: 26vmin; height: 26vmin; }
@keyframes floatLight {
    0%   { transform: translate(0, 110vh) scale(0.5); opacity: 0; }
    20%  { opacity: 0.55; }
    80%  { opacity: 0.55; }
    100% { transform: translate(10vw, -20vh) scale(1.5); opacity: 0; }
}

.content {
    position: relative;
    z-index: 10;
    width: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 10vmin 2vmin 12vmin;
    gap: 2vmin;
    flex-shrink: 0;
}

.header {
    display: flex; justify-content: center;
    margin: 0vmin 0vmin 1vmin 0vmin;
    animation: floatLogo 4s ease-in-out infinite;
}
.logo-container {
    width: 35.5vmin;
    height: 35.5vmin;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 4vmin rgba(179, 157, 219, 0.8), 0 1vmin 2.5vmin rgba(126, 87, 194, 0.35);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.logo-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.5vmin); }
}

.gallery-container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
    margin: 0vmin 0vmin 0vmin 0vmin;
}
.card {
    background: linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%);
    border: 0.6vmin solid #9575cd; border-radius: 4vmin;
    width: 100%; max-width: 60vmin; height: 64.8vmin;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    box-shadow: 0 2vmin 5vmin rgba(126, 87, 194, 0.4), inset 0 0 3vmin rgba(255, 255, 255, 0.7);
    position: relative;
    flex-shrink: 0;
}
.card img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform: scale(0.9) translateY(2vmin);
}
.card img.loaded { opacity: 1; transform: scale(1) translateY(0); }
.placeholder-text {
    font-size: 3vmin; color: #7e57c2; position: absolute;
    text-transform: uppercase; letter-spacing: 0.5vmin;
    font-weight: bold; opacity: 0.7;
}

.controls-block {
    display: flex; align-items: flex-end; justify-content: center;
    width: 100%;
    gap: 2vmin;
    position: relative;
    margin: 0vmin 0vmin 0vmin 11vmin;
}

.chibi-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    margin: 0vmin 0vmin 0vmin 0vmin;
}
.chibi {
    display: block;
    image-rendering: pixelated;
    user-select: none; -webkit-user-drag: none;
    pointer-events: auto;
    position: relative;
    transition: left 0.3s ease, top 0.3s ease;
}
.chibi img {
    width: 100%; height: auto; display: block;
    image-rendering: pixelated;
    filter: drop-shadow(0 0.5vmin 1vmin rgba(0,0,0,0.2));
    pointer-events: none;
    transform-origin: bottom center;
    animation: chibiSit 3s ease-in-out infinite;
}
#chibi-d1 { cursor: pointer; }
#chibi-d { cursor: default; }

@keyframes chibiSit {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.04); }
}
#chibi-d1.teleporting img {
    animation: teleportEffect 0.5s ease forwards;
}
@keyframes teleportEffect {
    0%   { filter: brightness(1) drop-shadow(0 0 0 transparent); transform: scaleY(1); }
    20%  { filter: brightness(0) drop-shadow(0 0 30px rgba(200,200,210,0.8)); transform: scaleY(1.2); }
    50%  { filter: brightness(0) drop-shadow(0 0 0 transparent); transform: scaleY(0.8) scaleX(0.2); opacity: 0.2; }
    100% { filter: brightness(1) drop-shadow(0 0 15px rgba(200,200,210,0.3)); transform: scaleY(1); opacity: 1; }
}

/* Чибик d1 — стартовая позиция из твоих настроек */
#chibi-d1 {
    width: 17vmin;
    left: 86vmin;
    top: 27.1vmin;
}
#chibi-d {
    width: 25vmin;
    left: -31.6vmin;
    top: 29.8vmin;
}

.controls {
    display: flex; align-items: center; justify-content: center;
    gap: 2vmin;
    flex-shrink: 0;
    padding-bottom: 1.5vmin;
}
.nav-btn {
    background: none; border: none; cursor: pointer;
    transition: transform 0.2s;
    outline: none;
    display: flex; align-items: center; justify-content: center;
}
.nav-btn:active { transform: scale(0.85); }
.nav-btn svg {
    width: 23vmin;
    height: 23vmin;
    fill: #b39ddb;
    filter: drop-shadow(0 0.6vmin 0 #9575cd) drop-shadow(0 0.8vmin 0.8vmin rgba(0, 0, 0, 0.2));
    transition: filter 0.2s;
}
.goto-btn {
    background: linear-gradient(180deg, #ede7f6 0%, #d1c4e9 100%);
    border: 0.4vmin solid #9575cd; border-radius: 1.5vmin;
    padding: 1.2vmin 2.5vmin;
    font-family: 'Comic Neue', cursive;
    font-size: 6.44vmin;
    font-weight: bold; color: #5e35b1;
    cursor: pointer;
    box-shadow: 0 0.6vmin 0 #9575cd, 0 1vmin 1.6vmin rgba(0, 0, 0, 0.15);
    transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.2vmin;
}
.goto-btn:active { transform: translateY(0.4vmin); box-shadow: 0 0.3vmin 0 #9575cd; }

.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(237, 231, 246, 0.7); backdrop-filter: blur(5px);
    z-index: 100; display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-box {
    background: linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%);
    border: 0.6vmin solid #9575cd; border-radius: 3vmin;
    padding: 4vmin;
    box-shadow: 0 2vmin 5vmin rgba(126, 87, 194, 0.6);
    display: flex; flex-direction: column; align-items: center; gap: 2vmin;
    transform: scale(0.8);
    transition: transform 0.3s;
    max-width: 80vmin; width: 90%;
}
.modal-overlay.active .modal-box { transform: scale(1); }
.modal-title {
    font-size: 3vmin; color: #5e35b1;
    text-transform: uppercase; letter-spacing: 0.3vmin;
}
.modal-input {
    font-family: 'Comic Neue', cursive; font-size: 3vmin;
    padding: 1.5vmin 2vmin;
    border: 0.4vmin solid #9575cd; border-radius: 1.5vmin;
    background: rgba(255, 255, 255, 0.85); color: #4527a0;
    text-align: center; width: 100%; outline: none;
}
.modal-buttons { display: flex; gap: 2vmin; width: 100%; justify-content: center; }
.modal-btn {
    font-family: 'Comic Neue', cursive; font-size: 2.5vmin;
    padding: 1vmin 2.5vmin;
    border: 0.4vmin solid #9575cd; border-radius: 1.5vmin;
    cursor: pointer; font-weight: bold;
    text-transform: uppercase;
    box-shadow: 0 0.6vmin 0 #9575cd;
}
.modal-btn.confirm { background: linear-gradient(180deg, #9575cd 0%, #7e57c2 100%); color: #fff; border-color: #7e57c2; box-shadow: 0 0.6vmin 0 #5e35b1; }
.modal-btn.cancel { background: linear-gradient(180deg, #fff 0%, #ede7f6 100%); color: #5e35b1; }

@media (max-width: 600px) {
    .content { padding: 9vmin 1vmin 13vmin; }
    .music-toggle {
        top: max(8px, calc(env(safe-area-inset-top) + 6px));
        right: 8px; min-height: 26px; padding: 0 9px; font-size: 8px;
    }
    .music-toggle svg { width: 11px; height: 11px; }
    .modal-box { padding: 5vmin; }
    .modal-title { font-size: 4vmin; }
    .modal-input { font-size: 4vmin; padding: 2vmin; }
    .modal-btn { font-size: 3.5vmin; padding: 1.5vmin 3vmin; }
}
</style>
</head>
<body>

<audio id="audioIntro" src="Doki.mp3" preload="auto"></audio>
<audio id="audioMain" src="Doki-Doki-Literature.mp3" preload="auto" loop></audio>
<audio id="audioClick" src="ddlc.mp3" preload="auto"></audio>
<audio id="audioJump" src="jump.mp3" preload="auto"></audio>

<div class="intro-overlay" id="introOverlay">
    <div class="intro-content">
        <img class="intro-logo" src="lord.png" alt="" draggable="false"
             onerror="this.src='https://via.placeholder.com/400/ede7f6/5e35b1?text=LOGO'">

    </div>
</div>

<div class="audio-prompt" id="audioPrompt" hidden>
    <button id="audioPromptButton" type="button" data-sound>CLICK TO START SOUND</button>
</div>

<div class="main-site" id="mainSite">
    <div class="bg-container">
        <div class="bg-layer layer-deep">
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
        </div>
        <div class="bg-layer layer-mid">
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
        </div>
        <div class="bg-layer layer-front">
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
            <div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div><div class="bg-tile"></div>
        </div>

    <div class="light-effects" id="light-effects"></div>

    <button class="music-toggle" id="musicToggle" type="button" aria-pressed="true" data-sound>
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zm-2-8.8v2.06a7 7 0 0 1 0 13.48v2.06a9 9 0 0 0 0-17.6z"/></svg>

    <div class="content">
        <div class="header" id="logoBlock">
            <div class="logo-container">
                <img src="lord.png" alt="Logo"

            </div>
        </div>

        <div class="gallery-container">
            <div class="card">
                <div class="placeholder-text" id="placeholder">Загрузка...</div>
                <img id="main-image" src="" alt="Gallery" style="display:none;">

        <div class="controls-block">
            <div class="chibi-wrap">
                <div class="chibi" id="chibi-d1">
                    <img src="d1.png" alt="chibi d1" draggable="false"
                         onerror="this.src='https://via.placeholder.com/100/ede7f6/5e35b1?text=d1'">
                </div>
            </div>

            <div class="controls">
                <button class="nav-btn" id="prevBtn" onclick="handleBtnClick(prevImage)">
                    <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
                </button>
                <button class="goto-btn" onclick="handleBtnClick(openGotoModal)">Go To</button>
                <button class="nav-btn" id="nextBtn" onclick="handleBtnClick(nextImage)">
                    <svg viewBox="0 0 24 24"><path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z"/></svg>

</div>

<div class="modal-overlay" id="gotoModal">
    <div class="modal-box">
        <div class="modal-title">Go to the picture</div>
        <input type="number" class="modal-input" id="gotoInput" placeholder="Number..." min="1">
        <div class="modal-buttons">
            <button class="modal-btn cancel" onclick="handleBtnClick(closeGotoModal)">revoke</button>
            <button class="modal-btn confirm" onclick="handleBtnClick(goToImage)">Go over</button>
        </div>
    </div>
</div>

<script>
'use strict';

/* ==================== ЭЛЕМЕНТЫ ==================== */
const audioIntro   = document.getElementById('audioIntro');
const audioMain    = document.getElementById('audioMain');
const audioClick   = document.getElementById('audioClick');
const audioJump    = document.getElementById('audioJump');
const introOverlay = document.getElementById('introOverlay');
const mainSite     = document.getElementById('mainSite');
const audioPrompt  = document.getElementById('audioPrompt');
const audioPromptButton = document.getElementById('audioPromptButton');
const musicToggle  = document.getElementById('musicToggle');
const musicToggleLabel = document.getElementById('musicToggleLabel');

const INTRO_AUDIO_VOLUME = 0.82;
const MAIN_AUDIO_VOLUME = 0.48;
const CLICK_AUDIO_VOLUME = 0.55;

let soundEnabled = true;
let introAnimationFinished = false;
let introAudioEnded = false;
let introAudioError = false;
let mainMusicStarted = false;

function showAudioPrompt() { audioPrompt.hidden = false; }
function hideAudioPrompt() { audioPrompt.hidden = true; }

function updateSoundButton() {
    musicToggleLabel.textContent = soundEnabled ? 'SOUND ON' : 'SOUND OFF';
    musicToggle.setAttribute('aria-pressed', String(soundEnabled));
    audioIntro.muted = !soundEnabled;
    audioMain.muted = !soundEnabled;
    audioClick.muted = !soundEnabled;
    audioJump.muted = !soundEnabled;
}

function playClickSound() {
    if (!soundEnabled || !audioClick || audioClick.error) return;
    try {
        audioClick.pause();
        audioClick.currentTime = 0;
        audioClick.volume = CLICK_AUDIO_VOLUME;
        const p = audioClick.play();
        if (p && p.catch) p.catch(() => {});
    } catch (_) {}
}

document.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-sound]');
    if (button && !button.disabled) playClickSound();
});

function maybeStartMainMusic() {
    if (!introAnimationFinished || !introAudioEnded || mainMusicStarted) return;
    if (audioIntro) { audioIntro.pause(); try { audioIntro.currentTime = 0; } catch (_) {} }
    audioMain.loop = true;
    audioMain.volume = MAIN_AUDIO_VOLUME;
    audioMain.muted = !soundEnabled;
    mainMusicStarted = true;
    try {
        const p = audioMain.play();
        if (p && p.then) p.then(hideAudioPrompt).catch(() => {
            mainMusicStarted = false;
            showAudioPrompt();
        });
    } catch (_) {
        mainMusicStarted = false;
        showAudioPrompt();
    }
}

function tryStartIntroAudio() {
    if (introAudioEnded || introAudioError) { maybeStartMainMusic(); return; }
    audioIntro.volume = INTRO_AUDIO_VOLUME;
    audioIntro.muted = !soundEnabled;
    try {
        const p = audioIntro.play();
        if (p && p.then) p.then(() => hideAudioPrompt()).catch(() => showAudioPrompt());
    } catch (_) { showAudioPrompt(); }
}

audioIntro.addEventListener('ended', () => {
    introAudioEnded = true;
    audioIntro.pause();
    try { audioIntro.currentTime = 0; } catch (_) {}
    maybeStartMainMusic();
});
audioIntro.addEventListener('error', () => {
    introAudioError = true; introAudioEnded = true;
    showAudioPrompt(); maybeStartMainMusic();
});
audioMain.addEventListener('error', () => { mainMusicStarted = false; showAudioPrompt(); });

audioPromptButton.addEventListener('click', async () => {
    soundEnabled = true;
    updateSoundButton();
    if (!introAudioEnded && !introAudioError) {
        try { await audioIntro.play(); hideAudioPrompt(); return; }
        catch (_) { introAudioError = true; introAudioEnded = true; }
    }
    if (introAnimationFinished && introAudioEnded) {
        mainMusicStarted = false; maybeStartMainMusic();
    } else { hideAudioPrompt(); }
});

musicToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    updateSoundButton();
    if (soundEnabled) {
        if (!introAudioEnded && audioIntro.paused && !introAudioError) tryStartIntroAudio();
        else if (introAnimationFinished && introAudioEnded && audioMain.paused) {
            mainMusicStarted = false; maybeStartMainMusic();
        }
    }
});

function startIntroAnimation() {
    window.setTimeout(() => introOverlay.classList.add('turn-white'), 5150);
    window.setTimeout(() => mainSite.classList.add('visible'), 6500);
    window.setTimeout(() => introOverlay.classList.add('fade-out'), 7350);
    window.setTimeout(() => {
        introAnimationFinished = true;
        introOverlay.hidden = true;
        maybeStartMainMusic();
    }, 8200);
}

function handleBtnClick(callback) { playClickSound(); callback(); }

(function createLightEffects() {
    const container = document.getElementById('light-effects');
    for (let i = 0; i < 15; i++) {
        const orb = document.createElement('div');
        orb.className = 'light-orb';
        orb.style.left = (Math.random() * 100) + 'vw';
        orb.style.animationDuration = (10 + Math.random() * 15) + 's';
        orb.style.animationDelay = (Math.random() * 15) + 's';
        orb.style.transform = 'scale(' + (0.5 + Math.random() * 1.5) + ')';
        container.appendChild(orb);
    }
})();

/* ==================== ГАЛЕРЕЯ ==================== */
let currentIndex = 0;
const maxImages  = 100;
const imgElement = document.getElementById('main-image');
const placeholder = document.getElementById('placeholder');
let imageList = [];

async function scanImages() {
    let i = 1;
    while (i <= maxImages) {
        const path = 'dd' + i + '.png';
        const exists = await checkImageExists(path);
        if (exists) { imageList.push(path); i++; }
        else break;
    }
    if (imageList.length === 0) {
        placeholder.textContent = "НЕТ КАРТИНОК";
        placeholder.style.display = 'block';
    } else { showImage(0); }
}
function checkImageExists(url) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}
function showImage(index) {
    if (imageList.length === 0) return;
    if (index < 0) index = imageList.length - 1;
    if (index >= imageList.length) index = 0;
    currentIndex = index;
    imgElement.classList.remove('loaded');
    imgElement.style.display = 'none';
    setTimeout(() => {
        imgElement.src = imageList[currentIndex];
        imgElement.style.display = 'block';
        placeholder.style.display = 'none';
        void imgElement.offsetWidth;
        imgElement.onload = () => imgElement.classList.add('loaded');
    }, 100);
}
function nextImage() { showImage(currentIndex + 1); }
function prevImage() { showImage(currentIndex - 1); }

const modal = document.getElementById('gotoModal');
const input = document.getElementById('gotoInput');
function openGotoModal() {
    if (imageList.length === 0) return;
    input.value = currentIndex + 1;
    modal.classList.add('active');
    setTimeout(() => input.focus(), 100);
}
function closeGotoModal() { modal.classList.remove('active'); }
function goToImage() {
    const num = parseInt(input.value, 10);
    if (isNaN(num) || num < 1 || num > imageList.length) {
        const box = document.querySelector('.modal-box');
        box.style.transform = 'translateX(-2vmin)';
        setTimeout(() => box.style.transform = 'translateX(2vmin)',  50);
        setTimeout(() => box.style.transform = 'translateX(-2vmin)', 100);
        setTimeout(() => box.style.transform = 'translateX(0)',      150);
        return;
    }
    showImage(num - 1);
    closeGotoModal();
}
modal.addEventListener('click', e => { if (e.target === modal) closeGotoModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGotoModal(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') goToImage(); });

let touchStartX = 0, touchEndX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend',   e => {
    touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) nextImage();
    if (touchEndX > touchStartX + 50) prevImage();
});

/* ============================================================
   ЧИБИК d1 — ТЕЛЕПОРТ ПО ТОЧКАМ
   ============================================================ */

const chibiD1 = document.getElementById('chibi-d1');

/* Стартовая позиция d1 (home) — из настроек */
const D1_HOME = { left: 86, top: 27.1 };

/* Точки телепорта d1 — из настроек */
const D1_POINTS = [
    { left: 28.8, top: 27.1 },
    { left: 26.7, top: -88.4 },
    { left: 86, top: 27.1 }
];

let currentPointIndex = -1;
let returnTimer = null;
let isTeleporting = false;

function playJumpSound() {
    if (!soundEnabled || !audioJump || audioJump.error) return;
    try {
        audioJump.pause();
        audioJump.currentTime = 0;
        const p = audioJump.play();
        if (p && p.catch) p.catch(() => {});
    } catch (_) {}
}

function applyD1Position(left, top) {
    chibiD1.style.left = left + 'vmin';
    chibiD1.style.top = top + 'vmin';
}

chibiD1.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isTeleporting) return;
    if (D1_POINTS.length === 0) return;

    isTeleporting = true;
    playJumpSound();
    chibiD1.classList.add('teleporting');

    // Выбираем случайную точку, кроме текущей
    let newIndex;
    do {
        newIndex = Math.floor(Math.random() * D1_POINTS.length);
    } while (newIndex === currentPointIndex && D1_POINTS.length > 1);

    currentPointIndex = newIndex;
    const p = D1_POINTS[newIndex];

    // Меняем позицию через половину анимации
    setTimeout(() => {
        applyD1Position(p.left, p.top);
    }, 250);

    setTimeout(() => {
        chibiD1.classList.remove('teleporting');
        isTeleporting = false;
    }, 500);

    // Через 5 сек возврат домой
    if (returnTimer) clearTimeout(returnTimer);
    returnTimer = setTimeout(() => {
        chibiD1.classList.add('teleporting');
        playJumpSound();
        setTimeout(() => {
            applyD1Position(D1_HOME.left, D1_HOME.top);
            currentPointIndex = -1;
        }, 250);
        setTimeout(() => chibiD1.classList.remove('teleporting'), 500);
    }, 5000);
});

/* ==================== СТАРТ ==================== */
window.addEventListener('load', () => {
    updateSoundButton();
    startIntroAnimation();
    scanImages();
    tryStartIntroAudio();

    const startOnInteraction = () => {
        if (!introAudioEnded && !introAudioError && audioIntro.paused) {
            tryStartIntroAudio();
        }
        document.removeEventListener('click', startOnInteraction);
        document.removeEventListener('touchstart', startOnInteraction);
        document.removeEventListener('keydown', startOnInteraction);
        document.removeEventListener('scroll', startOnInteraction);
    };
    document.addEventListener('click', startOnInteraction);
    document.addEventListener('touchstart', startOnInteraction);
    document.addEventListener('keydown', startOnInteraction);
    document.addEventListener('scroll', startOnInteraction, { passive: true });
}, { once: true });

</script>
